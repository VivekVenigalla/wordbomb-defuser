<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- the bomb's body -->
  <circle cx="44" cy="55" r="32" fill="#1f2937"/>
  <!-- a shine on the body -->
  <path d="M26 46 A20 20 0 0 1 40 33" fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <!-- the cap on top -->
  <rect x="37" y="14" width="14" height="12" rx="3" fill="#4b5563"/>
  <!-- the fuse -->
  <path d="M51 18 C62 10 70 14 74 6" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <!-- the spark -->
  <circle cx="76" cy="8" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="8" r="3" fill="#fef3c7"/>
  <!-- three letter tiles, like the prompt -->
  <rect x="22" y="52" width="14" height="16" rx="2" fill="#fbbf24"/>
  <rect x="38" y="52" width="14" height="16" rx="2" fill="#fbbf24"/>
  <rect x="54" y="52" width="14" height="16" rx="2" fill="#fbbf24"/>
</svg>
